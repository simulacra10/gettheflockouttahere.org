<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-2 focus:rounded-sm focus:bg-ink-900 focus:px-4 focus:py-2 focus:font-mono focus:text-sm focus:text-plate">
    Skip to content
  </a>
  {{ partial "nav.html" . }}
  <main id="main" class="flex-1 w-full max-w-5xl mx-auto px-4 py-10">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
