{{/* Usage: {{< carousel >}} — renders every page-bundle image as a
     swipeable strip using CSS scroll-snap. No JS, no external library. */}}
{{ $images := .Page.Resources.ByType "image" }}
{{ with $images }}
<div class="carousel-scroll -mx-4 sm:mx-0 flex gap-3 overflow-x-scroll snap-x snap-mandatory scroll-px-4 px-4 sm:px-0 pb-2">
  {{ range . }}
  <img
    src="{{ .RelPermalink }}"
    alt="{{ .Params.alt | default "" }}"
    class="h-72 sm:h-96 w-auto flex-shrink-0 snap-center rounded-sm border border-ink-900/10 object-cover"
    loading="lazy"
  >
  {{ end }}
</div>
{{ end }}
