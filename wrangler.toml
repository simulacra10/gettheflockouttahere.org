# Deployment config for gettheflockouttahere.org — a Cloudflare Worker
# serving static assets (Hugo's build output), not a Cloudflare Pages
# project. No Pages project exists on this account; this repo's Git
# integration is connected to a Worker, and `wrangler pages deploy`
# does not apply here.
#
# Build first, then ship the static output:
#   npm install && npm run build:css && hugo --gc --minify
#   npx wrangler deploy

name = "gettheflockouttahere"
compatibility_date = "2026-07-30"

[assets]
directory = "public"

# [observability] is intentionally absent for now — revisit if useful,
# but it isn't required for a static-assets-only Worker with no script.
