baseURL: "https://gettheflockouttahere.org/"
languageCode: "en-us"
title: "DeFlock Easton"
theme: "deflock"

enableRobotsTXT: false

build:
  writeStats: false

markup:
  goldmark:
    renderer:
      # Content is authored only by site maintainers via shortcodes
      # (community-link, council-table) that emit HTML; without this,
      # Goldmark silently strips or escapes their output.
      unsafe: true
  highlight:
    noClasses: false

outputFormats:
  # Plain-text rendition of every page, linked automatically wherever
  # HTML is (see the "Plain text" link in single.html / list.html).
  TXT:
    mediaType: "text/plain"
    baseName: "index"
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - TXT
  section:
    - HTML
    - RSS
    - TXT
  page:
    - HTML
    - TXT

taxonomies: {}

permalinks:
  updates: "/updates/:slug/"
